name: CI

on:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, zip, opcache, pdo_mysql, mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run tests
        run: composer test

      - name: Lint PHP
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Security audit
        run: composer audit

      - name: Lint PHP entrypoints
        run: |
          php -l index.php
          php -l constant.php
          php -l config/config.php
          find app -name "*.php" -exec php -l {} \;

      - name: Validate routes
        run: php roolith route:list

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
